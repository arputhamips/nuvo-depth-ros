name: ROS and client contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native runner architecture (ARM64 qualification is manual)
        type: choice
        options: [amd64, arm64, both]
        default: amd64
      publish_image:
        description: Publish the tested AMD64 + ARM64 trial image to GHCR (requires both)
        type: boolean
        default: false
      release_version:
        description: Optional package version for a fixed jazzy-VERSION image tag (requires publication)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  jazzy:
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.architecture == 'both' && '["amd64","arm64"]' || github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64' && '["arm64"]' || '["amd64"]') }}
    env:
      NUVO_TEST_ARCH: ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ros:jazzy-ros-base@sha256:103b6c417973394659af6804d4917cd489b91e5ed22eb7bef263025a3bed2410
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Validate publication request
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SELECTED_ARCH: ${{ inputs.architecture }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$PUBLISH_IMAGE" == true ]]; then
            test "$SELECTED_ARCH" = both
          fi
          if [[ -n "$RELEASE_VERSION" ]]; then
            test "$PUBLISH_IMAGE" = true
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          for package in ('nuvo_camera', 'nuvo_camera_msgs', 'nuvo_bringup', 'nuvo_depth_client_vendor'):
              version = ET.parse(f'{package}/package.xml').findtext('version')
              if version != os.environ['RELEASE_VERSION']:
                  raise SystemExit(f'{package}: version {version} does not match requested release')
          PY
          fi
      - name: Install declared development dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build python3-colcon-common-extensions nlohmann-json3-dev libboost-system-dev libssl-dev libc-ares-dev openssl ros-jazzy-rclcpp-components ros-jazzy-sensor-msgs ros-jazzy-stereo-msgs ros-jazzy-diagnostic-msgs ros-jazzy-rosgraph-msgs ros-jazzy-ament-cmake-gtest ros-jazzy-ament-cmake-python ros-jazzy-ament-cmake-pytest ros-jazzy-rmw-cyclonedds-cpp
      - name: Verify immutable SDK and independent public client
        run: |
          python3 tools/refresh_sdk.py --check
          python3 test/refresh_sdk_test.py
          python3 test/native_preflight_test.py
          python3 test/run_camera_test.py
          cmake -S nuvo_depth_client_vendor/upstream -B output/client -G Ninja -DNUVO_CLIENT_BUILD_TESTS=ON
          cmake --build output/client -j2
          ctest --test-dir output/client --output-on-failure
      - name: Build and test ROS component and DDS acquisition
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --executor sequential --cmake-args -DCMAKE_BUILD_TYPE=Release
          colcon test --return-code-on-test-failure
          colcon test-result --verbose
          source install/setup.bash
          export CYCLONEDDS_URI="file://$PWD/nuvo_bringup/config/cyclonedds.xml"
          RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 test/installed_consumer.py
          RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 test/robot_integration.py
          RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 test/integration.py
          RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 test/fullsize.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jazzy-contract-results-${{ env.NUVO_TEST_ARCH }}
          path: |
            log/
            build/*/test_results/
            output/client/Testing/
            output/fullsize/
            nuvo_depth_client_vendor/upstream/SOURCE-MANIFEST.json
          if-no-files-found: error
  deployment:
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        https: ['ON', 'OFF']
        architecture: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.architecture == 'both' && '["amd64","arm64"]' || github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64' && '["arm64"]' || '["amd64"]') }}
    env:
      NUVO_TEST_ARCH: ${{ matrix.architecture }}
      NUVO_TEST_IMAGE: nuvo-depth-ros:ci-${{ matrix.https }}
      NUVO_TEST_OUTPUT_DIR: ${{ github.workspace }}/output/deployment
      ROS_DOMAIN_ID: '92'
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Install ROS host observer dependencies
        shell: bash
        run: |
          # Official ROS apt-source package, pinned independently of apt packages.
          curl --fail --location --retry 3 --output /tmp/ros2-apt-source.deb \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
          echo 'f31d84adf5054c7d60ded0e82c0f776a77ea33af53d08f40b9ad7c94cca55296  /tmp/ros2-apt-source.deb' | sha256sum --check
          sudo apt-get install -y /tmp/ros2-apt-source.deb
          # Some hosted AMD64 runners download from the Azure mirror extremely
          # slowly. Use Ubuntu's standard HTTPS archive; ARM64 ports stay intact.
          # Hosted images may select the archive through mirror+file instead.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          apt_network=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update
          sudo apt-get "${apt_network[@]}" install -y --no-install-recommends \
            python3-colcon-common-extensions ros-jazzy-ament-cmake \
            ros-jazzy-rosidl-default-generators ros-jazzy-rclpy \
            ros-jazzy-sensor-msgs ros-jazzy-stereo-msgs ros-jazzy-diagnostic-msgs ros-jazzy-rosgraph-msgs \
            ros-jazzy-rmw-cyclonedds-cpp
      - name: Build host metadata messages and final runtime image
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          test "$(dpkg --print-architecture)" = "$NUVO_TEST_ARCH"
          colcon build --packages-select nuvo_camera_msgs --executor sequential
          mkdir -p "$NUVO_TEST_OUTPUT_DIR"
          docker build --platform "linux/$NUVO_TEST_ARCH" --progress plain --build-arg NUVO_CLIENT_WITH_HTTPS=${{ matrix.https }} --build-arg VCS_REF="$GITHUB_SHA" -f docker/Dockerfile -t "$NUVO_TEST_IMAGE" . \
            2>&1 | tee "$NUVO_TEST_OUTPUT_DIR/docker-build.log"
          test "$(docker image inspect "$NUVO_TEST_IMAGE" --format '{{.Architecture}}')" = "$NUVO_TEST_ARCH"
      - name: Native host socket and clock to unprivileged ROS container
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export CYCLONEDDS_URI="file://$PWD/nuvo_bringup/config/cyclonedds.xml"
          python3 test/container_host_ipc.py
          python3 test/fullsize.py --container
          python3 test/docker_dependencies.py
          if [[ '${{ matrix.https }}' == ON ]]; then
            python3 test/https_container.py
          fi
      - name: Collect reviewable ARM64 runtime bundle
        if: always() && github.event_name == 'workflow_dispatch' && matrix.architecture == 'arm64'
        shell: bash
        run: |
          mkdir -p "$NUVO_TEST_OUTPUT_DIR"
          if docker image inspect "$NUVO_TEST_IMAGE" >/dev/null; then
            bundle_dir="$(mktemp -d)"
            container_id="$(docker create "$NUVO_TEST_IMAGE")"
            docker cp "$container_id:/ws/install" "$bundle_dir/install"
            docker rm "$container_id"
            tar -czf "$NUVO_TEST_OUTPUT_DIR/nuvo-depth-ros-jazzy-arm64-https-${{ matrix.https }}.tar.gz" \
              -C "$bundle_dir" install
            sha256sum "$NUVO_TEST_OUTPUT_DIR/"*.tar.gz > "$NUVO_TEST_OUTPUT_DIR/SHA256SUMS"
          fi
      - name: Record resolved deployment versions
        if: always()
        shell: bash
        run: |
          mkdir -p "$NUVO_TEST_OUTPUT_DIR"
          dpkg-query -W -f='${Package}\t${Version}\n' > "$NUVO_TEST_OUTPUT_DIR/host-packages.tsv"
          docker version > "$NUVO_TEST_OUTPUT_DIR/docker-version.txt"
          if docker image inspect "$NUVO_TEST_IMAGE" > "$NUVO_TEST_OUTPUT_DIR/image-inspect.json"; then
            docker run --rm "$NUVO_TEST_IMAGE" dpkg-query -W -f='${Package}\t${Version}\n' \
              > "$NUVO_TEST_OUTPUT_DIR/container-packages.tsv"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: host-container-deployment-results-${{ env.NUVO_TEST_ARCH }}-https-${{ matrix.https }}
          path: |
            output/deployment/
            log/
            nuvo_depth_client_vendor/upstream/SOURCE-MANIFEST.json
          if-no-files-found: error

      - name: Save tested image for the manual publication job
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image && matrix.https == 'ON'
        shell: bash
        run: |
          mkdir -p output/image
          docker save "$NUVO_TEST_IMAGE" | gzip -1 > output/image/image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image && matrix.https == 'ON'
        with:
          name: tested-image-${{ matrix.architecture }}
          path: output/image/image.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  publish-image:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image && inputs.architecture == 'both'
    needs: [jazzy, deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-jazzy-trial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: tested-image-*
          path: images
      - name: Publish the tested images and multi-platform trial manifest
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          release_tags=()
          if [[ -n "$RELEASE_VERSION" ]]; then
            release_image="$registry_image:jazzy-$RELEASE_VERSION"
            if docker buildx imagetools inspect "$release_image" >/dev/null 2>&1; then
              echo "Refusing to replace existing release image: $release_image" >&2
              exit 1
            fi
            release_tags=(--tag "$release_image")
          fi
          for architecture in amd64 arm64; do
            docker load --input "images/tested-image-$architecture/image.tar.gz"
            test "$(docker image inspect nuvo-depth-ros:ci-ON --format '{{.Architecture}}')" = "$architecture"
            test "$(docker image inspect nuvo-depth-ros:ci-ON --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
            docker tag nuvo-depth-ros:ci-ON "$registry_image:sha-$GITHUB_SHA-$architecture"
            docker push "$registry_image:sha-$GITHUB_SHA-$architecture"
          done
          docker buildx imagetools create \
            --tag "$registry_image:sha-$GITHUB_SHA" --tag "$registry_image:jazzy-trial" \
            "${release_tags[@]}" \
            "$registry_image:sha-$GITHUB_SHA-amd64" "$registry_image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$registry_image:sha-$GITHUB_SHA" | tee image-manifest.txt
          git archive --format=tar.gz --prefix=nuvo-depth-ros/ HEAD > nuvo-depth-ros-source.tar.gz
          sha256sum nuvo-depth-ros-source.tar.gz > SHA256SUMS
          {
            echo '### Nuvo Depth ROS Jazzy trial image'
            echo "Source commit: $GITHUB_SHA"
            echo "Pull: docker pull $registry_image:jazzy-trial"
            echo "Pinned commit image: $registry_image:sha-$GITHUB_SHA"
            if [[ -n "$RELEASE_VERSION" ]]; then
              echo "Release image: $registry_image:jazzy-$RELEASE_VERSION"
            fi
            echo 'Platforms: linux/amd64 and linux/arm64. Synthetic CI checks are not Pi camera qualification.'
            echo 'For a new GHCR package, set package visibility to Public and verify an anonymous pull.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trial-image-provenance
          path: |
            image-manifest.txt
            nuvo-depth-ros-source.tar.gz
            SHA256SUMS
          if-no-files-found: error
