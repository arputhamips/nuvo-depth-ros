name: ROS and client contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base@sha256:103b6c417973394659af6804d4917cd489b91e5ed22eb7bef263025a3bed2410
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Install declared development dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build python3-colcon-common-extensions nlohmann-json3-dev libboost-system-dev libssl-dev libc-ares-dev openssl ros-jazzy-rclcpp-components ros-jazzy-sensor-msgs ros-jazzy-diagnostic-msgs ros-jazzy-rosgraph-msgs ros-jazzy-ament-cmake-gtest ros-jazzy-rmw-cyclonedds-cpp
      - name: Verify immutable SDK and independent public client
        run: |
          python3 tools/refresh_sdk.py --check
          python3 test/refresh_sdk_test.py
          cmake -S nuvo_depth_client_vendor/upstream -B output/client -G Ninja -DNUVO_CLIENT_BUILD_TESTS=ON
          cmake --build output/client -j2
          ctest --test-dir output/client --output-on-failure
      - name: Build and test ROS component and DDS acquisition
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --executor sequential --cmake-args -DCMAKE_BUILD_TYPE=Release
          colcon test --return-code-on-test-failure
          colcon test-result --verbose
          source install/setup.bash
          RMW_IMPLEMENTATION=rmw_cyclonedds_cpp python3 test/integration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: jazzy-contract-results
          path: |
            log/
            build/*/test_results/
            output/client/Testing/
            nuvo_depth_client_vendor/upstream/SOURCE-MANIFEST.json
          if-no-files-found: error
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NUVO_TEST_IMAGE: nuvo-depth-ros:ci
      NUVO_TEST_OUTPUT_DIR: ${{ github.workspace }}/output/deployment
      ROS_DOMAIN_ID: '92'
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Install ROS host observer dependencies
        shell: bash
        run: |
          # Official ROS apt-source package, pinned independently of apt packages.
          curl --fail --location --retry 3 --output /tmp/ros2-apt-source.deb \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
          echo 'f31d84adf5054c7d60ded0e82c0f776a77ea33af53d08f40b9ad7c94cca55296  /tmp/ros2-apt-source.deb' | sha256sum --check
          sudo apt-get install -y /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions ros-jazzy-ament-cmake \
            ros-jazzy-rosidl-default-generators ros-jazzy-rclpy \
            ros-jazzy-sensor-msgs ros-jazzy-diagnostic-msgs ros-jazzy-rosgraph-msgs \
            ros-jazzy-rmw-cyclonedds-cpp
      - name: Build host metadata messages and final runtime image
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select nuvo_camera_msgs --executor sequential
          mkdir -p "$NUVO_TEST_OUTPUT_DIR"
          docker build --progress plain -f docker/Dockerfile -t "$NUVO_TEST_IMAGE" . \
            2>&1 | tee "$NUVO_TEST_OUTPUT_DIR/docker-build.log"
      - name: Native host socket and clock to unprivileged ROS container
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 test/container_host_ipc.py
      - name: Record resolved deployment versions
        if: always()
        shell: bash
        run: |
          mkdir -p "$NUVO_TEST_OUTPUT_DIR"
          dpkg-query -W -f='${Package}\t${Version}\n' > "$NUVO_TEST_OUTPUT_DIR/host-packages.tsv"
          docker version > "$NUVO_TEST_OUTPUT_DIR/docker-version.txt"
          if docker image inspect "$NUVO_TEST_IMAGE" > "$NUVO_TEST_OUTPUT_DIR/image-inspect.json"; then
            docker run --rm "$NUVO_TEST_IMAGE" dpkg-query -W -f='${Package}\t${Version}\n' \
              > "$NUVO_TEST_OUTPUT_DIR/container-packages.tsv"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: host-container-deployment-results
          path: |
            output/deployment/
            log/
            nuvo_depth_client_vendor/upstream/SOURCE-MANIFEST.json
          if-no-files-found: error
