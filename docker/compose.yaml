services:
  camera:
    image: "${NUVO_IMAGE:-ghcr.io/arputhamips/nuvo-depth-ros:jazzy-0.1.1}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NUVO_CLIENT_WITH_HTTPS: "${NUVO_CLIENT_WITH_HTTPS:-ON}"
    # ROS DDS networking only; source: local reads host memfd frames via AF_UNIX.
    # Nuvo's host gateway is independent and can remain masked for local-only use.
    network_mode: host
    # Shared DDS SHM namespace for local ROS containers. This is independent
    # of Nuvo memfd transport, which uses SCM_RIGHTS through the mounted socket.
    ipc: host
    group_add:
      - "${NUVO_VIDEO_GID:?Set NUVO_VIDEO_GID from getent group nuvo-video on the Pi}"
    volumes:
      - /run/nuvo-depth:/run/nuvo-depth:ro
      - ../nuvo_bringup/config:/config:ro
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
      CYCLONEDDS_URI: "${CYCLONEDDS_URI:-file:///ws/install/share/nuvo_bringup/config/cyclonedds.xml}"
    command: ["ros2", "launch", "nuvo_bringup", "camera.launch.py", "namespace:=${NUVO_NAMESPACE:-nuvo/front}", "config:=${NUVO_CONFIG:-/config/camera.yaml}"]
    init: true
    restart: unless-stopped
